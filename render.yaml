# Render Blueprint — one web service running the Docker image, with a
# persistent disk so all sales data survives restarts and redeploys.
# Deploy: push this repo to GitHub, then in Render: New → Blueprint → pick the repo.
services:
  - type: web
    name: lead-gen-ai
    runtime: docker
    plan: starter                 # persistent disks require a paid instance (free has none)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /            # serves the app shell (200) — no auth needed
    disk:
      name: data                  # persistent volume — the SQLite DB lives here
      mountPath: /var/data
      sizeGB: 1                   # ~13MB today; 1GB is plenty of headroom
    envVars:
      # Point the app at the mounted disk so the DB persists across deploys.
      - key: DATA_DIR
        value: /var/data
      # Set the secret values in the Render dashboard (sync:false = prompt, never stored in git)
      - key: APOLLO_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional — only needed when you turn on email sending:
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
