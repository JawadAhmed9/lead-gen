<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stemronic AI — Lead Gen Platform</title>

    <!-- Favicon: Stemronic hexagon-node mark -->

    <!-- Tailwind CDN (Play CDN — JIT, works without config files) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
            colors: {
              navy: { 950: '#060B18', 900: '#0F172A', 800: '#1E293B', 700: '#334155' },
              brand: {
                50: '#ECF5FF', 100: '#D9EBFF', 200: '#B6D8FF', 300: '#86BEFF',
                400: '#4F9EFF', 500: '#2B84FF', 600: '#1670F0', 700: '#1059C8',
                800: '#14489E', 900: '#163F7C', 950: '#0E274D',
              },
            },
            boxShadow: {
              card: '0 1px 3px 0 rgb(0 0 0 / .06), 0 1px 2px -1px rgb(0 0 0 / .04)',
              panel: '0 8px 32px -4px rgb(0 0 0 / .12), 0 2px 8px -2px rgb(0 0 0 / .08)',
            },
          },
        },
      }
    </script>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: 'Inter', system-ui, sans-serif; background: #F8FAFC; -webkit-font-smoothing: antialiased; }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
      ::selection { background: #BFDBFE; }

      /* Skeleton shimmer */
      @keyframes shimmer {
        0%   { background-position: -600px 0; }
        100% { background-position: 600px 0; }
      }
      .skeleton {
        background: linear-gradient(90deg, #F1F5F9 25%, #E2E8F0 50%, #F1F5F9 75%);
        background-size: 600px 100%;
        animation: shimmer 1.4s infinite;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
